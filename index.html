<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>गोष्ट सव्वा रुपयाची — बाळाजी गणपत वाजे यांच्या कर्तृत्वाची! - ऑनलाइन फ्लिपबुक</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#202124;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;overflow:hidden}
.toolbar{height:54px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:#292a2d;box-shadow:0 2px 10px #0008;position:relative;z-index:10}.title{font-weight:700;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{border:0;background:#414246;color:#fff;border-radius:7px;padding:8px 12px;cursor:pointer;font-size:15px}.btn:hover{background:#55565b}.counter{min-width:95px;text-align:center;font-variant-numeric:tabular-nums}.stage{height:calc(100vh - 54px);display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;background:radial-gradient(circle at center,#444 0,#282828 52%,#181818 100%)}
#book{filter:drop-shadow(0 16px 22px #000b);margin:0!important;padding:0!important}.stf__parent,.stf__block,.stf__item{margin:0!important;padding:0!important;gap:0!important}.page{background:#fff;overflow:hidden}.page img{display:block;width:100%;height:100%;object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}.page-cover{background:#fff}.hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;color:#ddd;background:#0007;padding:5px 10px;border-radius:12px;pointer-events:none;z-index:9}
@media(max-width:700px){.title{display:none}.toolbar{justify-content:center}.toolbar{padding:6px 8px}.title{font-size:13px}.btn{padding:7px 9px}.hideMobile{display:none}.stage{padding:6px}.counter{min-width:76px;font-size:13px}.hint{display:none}}
</style>
</head>
<body>
<div class="toolbar">
  <div class="title">गोष्ट सव्वा रुपयाची — बाळाजी गणपत वाजे यांच्या कर्तृत्वाची!</div>
  <button class="btn hideMobile" id="first" title="पहिले पान">⏮</button>
  <button class="btn" id="prev" title="मागील पान">◀</button>
  <span class="counter"><span id="cur">1</span> / 64</span>
  <button class="btn" id="next" title="पुढील पान">▶</button>
  <button class="btn hideMobile" id="last" title="शेवटचे पान">⏭</button>
  <button class="btn" id="full" title="Fullscreen">⛶</button>
</div>
<div class="stage"><div id="book"></div></div>
<div class="hint">पानाच्या कोपऱ्यावर क्लिक/ड्रॅग करा - प्रत्यक्ष पुस्तकासारखे पान उलटेल</div>
<script>
const TOTAL=64;
const bookEl=document.getElementById('book');
for(let n=1;n<=TOTAL;n++){
  const p=document.createElement('div');
  p.className='page'+((n===1||n===TOTAL)?' page-cover':'');
  p.dataset.density=(n===1||n===TOTAL)?'hard':'soft';
  const im=document.createElement('img');
  im.src='+String(n).padStart(3,'0')+'.jpg'; im.alt='Page '+n; im.loading=n<5?'eager':'lazy'; im.draggable=false;
  p.appendChild(im); bookEl.appendChild(p);
}
const pf=new St.PageFlip(bookEl,{
  width:875,height:1158,
  size:'stretch',minWidth:140,maxWidth:875,minHeight:185,maxHeight:1158,
  maxShadowOpacity:0.55,showCover:true,mobileScrollSupport:false,
  usePortrait:true,autoSize:true,drawShadow:true,flippingTime:850,
  startZIndex:0,clickEventForward:true,swipeDistance:25,showPageCorners:true,disableFlipByClick:false
});
pf.loadFromHTML(document.querySelectorAll('.page'));
const cur=document.getElementById('cur');
function update(){cur.textContent=pf.getCurrentPageIndex()+1}
pf.on('flip',update);pf.on('changeOrientation',update);pf.on('init',update);
document.getElementById('prev').onclick=()=>pf.flipPrev();
document.getElementById('next').onclick=()=>pf.flipNext();
document.getElementById('first').onclick=()=>pf.turnToPage(0);
document.getElementById('last').onclick=()=>pf.turnToPage(TOTAL-1);
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();pf.flipNext()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();pf.flipPrev()}else if(e.key==='Home')pf.turnToPage(0);else if(e.key==='End')pf.turnToPage(TOTAL-1)});
</script>
</body></html>
